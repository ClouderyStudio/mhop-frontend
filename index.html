<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2f8f83" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>心光 MHOP · 公益心理辅助平台</title>
    <!-- 运行时环境配置：部署后可直接改 dist/env.js，无需重新构建（建议对该文件关闭缓存） -->
    <script src="/env.js"></script>
    <!-- 首屏日夜模式引导：在样式解析前同步写入 dark 类，避免暗色偏好用户看到白屏闪烁 -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('mhop-theme')
          var dark = saved === null
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : saved === 'dark'
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) { /* 忽略，交由应用内默认浅色 */ }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
